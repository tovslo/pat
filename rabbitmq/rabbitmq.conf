## RabbitMQ Production Configuration
## ref: spec.md → RabbitMQ + Celery (At-Least-Once Delivery, DLX)

# ── Networking ────────────────────────────────────────────────────────────────
listeners.tcp.default = 5672
management.listener.port = 15672
prometheus.return_per_object_metrics = true
prometheus.tcp.port = 15692

# ── Memory & Disk ─────────────────────────────────────────────────────────────
# Broker pauses publishers when memory > 60% of total RAM
vm_memory_high_watermark.relative = 0.6
# Broker pauses publishers when free disk < 1GB
disk_free_limit.absolute = 1GB

# ── Heartbeat ─────────────────────────────────────────────────────────────────
# ref: celeryconfig.py → broker_heartbeat = 60
heartbeat = 60

# ── Persistence ───────────────────────────────────────────────────────────────
# Queues declared as durable survive broker restarts
# (Celery task_queues use durable=True — matches this config)
queue_master_locator = client-local

# ── Message TTL & DLX defaults ────────────────────────────────────────────────
# Per-queue TTLs are set via queue_arguments in celeryconfig.py
# DLX exchange is declared by Celery workers on startup

# ── Management API ───────────────────────────────────────────────────────────
management.path_prefix = /rabbitmq
# Limit management UI to 500 rows for performance
management.sample_retention_policies.global.minute = 5
management.sample_retention_policies.global.hour   = 60
management.sample_retention_policies.global.day    = 1200

# ── Logging ───────────────────────────────────────────────────────────────────
log.console = true
log.console.level = warning
log.file = false

# ── Cluster (MVP: single-node, future multi-node Swarm) ──────────────────────
# Multi-node: set RABBITMQ_ERLANG_COOKIE secret and configure
#   cluster_formation.peer_discovery_backend = rabbit_peer_discovery_classic_config
#   cluster_formation.classic_config.nodes.1 = rabbit@rabbitmq1
#   cluster_formation.classic_config.nodes.2 = rabbit@rabbitmq2
# For MVP single-node no cluster config needed.
